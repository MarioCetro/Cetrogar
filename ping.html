<html><head>
        <style>
            * {
  font-family: Calibri, Arial !important;
}
.net-err {
  width: 100%;
  display: block;
  z-index: 999;
  padding: 15px 10px;
  background: rgb(255, 9, 9);
  color: #fff;
  font-weight: bold !important;
  text-align: center;
  position: fixed;
  top: -1px;
  left: -1px;
  border: 1px solid #ddd;
  font-size: 30px;
  opacity: 0.9;
  filter: alpha(opacity=90);
  /* IE */
}
.hide {
  color: #F00;
  display: hide;
}
        </style>
    </head>
    <body>
    



  <title>Status</title>



  <h1>This page will be tracking your internet connection</h1>
  <h2>You will be notified when you loose connection</h2>
  <h3>e.g. Go to File &gt; Work Offline</h3>



        <script type="text/javascript">
            (function(win) {
  var _ = {};

  _.win = win;

  _.doc = _.win.document;

  _.status = _.doc.createElement('div');
  _.status.className = "hide";
  _.status.innerHTML = "You are now offline !";

  _.doc.getElementsByTagName('body')[0].appendChild(_.status);

  _.img = new Image();

  _.loop = function() {
    _.win.setTimeout(_.nextSrc, 5000);
  };

  _.onLine = function() {
    _.status.className = "hide"; // hide
    _.loop();
  };

  _.offLine = function() {
    _.status.className = "net-err"; // show
    _.loop();
  };

  _.img.onload = _.onLine;
  _.img.onerror = _.offLine;

  _.nextSrc = function() {
    _.img.src = "https://mariocetro.github.io/Cetrogar/img/bn_cetrogar.jpg" + _.win.Math.random();
  };

  _.loop();
})(window);
        </script><div class="net-err">You are now offline !</div>
    

</body></html>
